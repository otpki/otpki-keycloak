name: Build and Push

permissions:
  contents: read

on:
  push:
    tags: ["*"]
  workflow_dispatch:

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.check.outputs.valid }}
    steps:
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-otpki\.[0-9]+$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: validate-tag
    if: needs.validate-tag.outputs.valid == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
      checks: write
    uses: otpki/.github/.github/workflows/reusable-docker-publish.yml@v1
    with:
      registry_url: ${{ vars.REGISTRY_URL_PUBLIC }}
      image_prefix: otpki
      app: keycloak
      image_name: otpki-keycloak
      platforms: linux/amd64,linux/arm64
      provenance: false
      ghcr-mirror: true
      allow-trivy-config-override: true
      node-cache-path: theme/package-lock.json
      pre-build-commands: |
        cd theme
        npm ci
        npm run build-keycloak-theme
      pre-build-artifacts: theme/dist_keycloak
      cache_from: |
        type=gha,scope=otpki-keycloak
      cache_to: |
        type=gha,mode=max,scope=otpki-keycloak
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
